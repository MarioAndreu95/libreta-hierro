<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de Hierro</title>
<meta name="description" content="Rutinas, entrenos y progreso en el gimnasio">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
/* En la app instalada de iOS el 100% puede quedarse corto: usamos la altura completa de la pantalla */
@supports (height:100lvh){html,body{height:100lvh}}
body{display:flex;flex-direction:column;position:relative}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<style>
/* Layout: app móvil de una columna al estilo de los trackers modernos: títulos grandes, tarjetas redondeadas sin bordes, azul eléctrico como único acento, tabla de series con columna "Anterior". */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#EEF0F4; --line:#E3E6EC;
  --fg:#0D1117; --muted:#6A7383; --accent:#1E7BFF; --accent-ink:#FFFFFF; --accent-soft:#E5F0FF;
  --pr:#E39A0B; --ok:#16A34A; --ok-soft:#E3F6EA; --danger:#E5383B;
  --c1:#1E7BFF; --c2:#FF6B3D; --c3:#12B886; --c4:#A855F7;
  --avL:42%; --avS:.14; --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0B0D; --surface:#17181C; --surface2:#24262C; --line:#2A2D33;
  --fg:#F3F4F6; --muted:#8B93A1; --accent:#2F8BFF; --accent-ink:#FFFFFF; --accent-soft:#132640;
  --pr:#FBBF24; --ok:#22C55E; --ok-soft:#0F2A1A; --danger:#FF5C5F;
  --c1:#3B93FF; --c2:#FF8A5C; --c3:#2DD4A4; --c4:#C084FC;
  --avL:68%; --avS:.18; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B0D; --surface:#17181C; --surface2:#24262C; --line:#2A2D33;
  --fg:#F3F4F6; --muted:#8B93A1; --accent:#2F8BFF; --accent-ink:#FFFFFF; --accent-soft:#132640;
  --pr:#FBBF24; --ok:#22C55E; --ok-soft:#0F2A1A; --danger:#FF5C5F;
  --c1:#3B93FF; --c2:#FF8A5C; --c3:#2DD4A4; --c4:#C084FC;
  --avL:68%; --avS:.18; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:relative;flex:none;padding-top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header.top .wrap{display:flex;align-items:center;gap:6px;min-height:60px;padding-block:26px 8px}
h1{font-weight:900;font-size:40px;line-height:1.02;margin:0;letter-spacing:-.04em;text-wrap:balance;color:var(--fg)}
#sheet h1{font-size:28px;letter-spacing:-.03em}
h2{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.titles{display:flex;flex-direction:column;min-width:0;flex:1}
.titles h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles .sub{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.titles h1{padding-block:2px}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-block:8px 100px}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.tap{cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:transform .12s}
.tap:active{transform:scale(.985)}
.card-title{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chev{color:var(--muted);font-size:22px;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:0;white-space:nowrap}
button.chip{cursor:pointer;font-size:14px;padding:8px 14px}
button.chip.on{background:var(--accent);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.02em;background:hsl(var(--h) 85% 55% / var(--avS));color:hsl(var(--h) 75% var(--avL))}
.av.sm{width:36px;height:36px;font-size:12px}
.av.img{background:var(--surface2);overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
.av.img img{width:100%;height:100%;object-fit:cover;display:block}

.btn{border:0;background:var(--surface2);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.big{width:100%;font-size:17px;font-weight:700;min-height:54px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn.pill{border-radius:999px}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon:active{background:var(--surface2)}
.icon.back{color:var(--accent);font-size:26px;margin-left:-8px}
.icon.armed{width:auto;border-radius:10px;padding:0 10px;font-size:12px;font-weight:700;background:var(--danger);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{border:0;background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;box-shadow:var(--shadow)}
.card .field{background:var(--surface2);box-shadow:none}
.field:focus{outline:2px solid var(--accent);outline-offset:0}
label.lbl{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.banner{background:color-mix(in srgb,var(--pr) 14%,var(--surface));color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:13px}
.banner b{color:var(--pr)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r)}

/* ejercicios en día */
.ex{display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;gap:12px;align-items:center}
.ex-name{font-weight:700;font-size:16px;color:var(--accent);letter-spacing:-.01em}
.ex-meta{font-size:13px;color:var(--muted)}
.ex-params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ex-params .field{padding:8px 10px;min-height:42px}

/* sesión */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v.live{color:var(--accent)}
.sess-ex{padding:16px 0 8px;border-bottom:1px solid var(--line)}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed}
.sets th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:0 2px 2px}
.sets th:nth-child(1){width:42px}.sets th:nth-child(2){width:26%}.sets th:nth-child(5){width:48px}.sets th:nth-child(6){width:44px}
.sets td{padding:0 2px;text-align:center;vertical-align:middle}
.sets tbody tr td:first-child{border-radius:10px 0 0 10px}.sets tbody tr td:last-child{border-radius:0 10px 10px 0}
.setn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--surface2);font-weight:700;font-size:14px}
.prevc{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input,.sets select{width:100%;border:0;background:var(--surface2);border-radius:8px;min-height:40px;padding:4px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.sets input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.sets tr.done td{background:var(--ok-soft)}
.sets tr.done input,.sets tr.done select,.sets tr.done .setn{background:transparent}
.check{width:38px;height:38px;border-radius:10px;border:0;background:var(--surface2);cursor:pointer;font-size:17px;font-weight:800;color:var(--muted)}
tr.done .check{background:var(--ok);color:#fff}
.badge-pr{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--pr);background:color-mix(in srgb,var(--pr) 15%,transparent);border-radius:999px;padding:3px 10px}
.addset{width:100%;margin-top:4px}
.clock{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}

/* tab bar */
nav.tabs{position:relative;flex:none;z-index:6;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;position:relative}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .live{position:absolute;top:6px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}

#restbar{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7}
#restbar .inner{max-width:608px;margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--accent);color:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(30,123,255,.35)}
@media (min-width:660px){#restbar .inner{margin-inline:auto}}
#restbar .clock{font-size:28px;min-width:70px}
#restbar button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;min-height:40px;padding:0 10px;font-weight:700;cursor:pointer}
#restbar .bar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
#restbar .bar i{display:block;height:100%;background:#fff}

/* picker */
#sheet{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .head{padding-block:22px 10px;display:flex;flex-direction:column;gap:10px}
#sheet .head>.wrap{width:100%}
#sheet .groups,.groups{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.exsec{display:flex;flex-direction:column;gap:8px}
.exsec h2{display:flex;justify-content:space-between;align-items:baseline}
.exsec h2 span{color:var(--accent);font-size:12px}
.exrows{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:2px 14px}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .nm{font-weight:600}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .av{width:72px;height:72px;font-size:20px}
#sheet .list{flex:1;overflow-y:auto}
#sheet .foot{border-top:1px solid var(--line);padding-block:10px;background:var(--surface)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.pick .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:transparent}
.pick.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.pick.on{background:linear-gradient(90deg,transparent,var(--accent-soft))}
.grp-title{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:18px}

.rlist{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gl) var(--gr);margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding:4px var(--gr) 14px var(--gl);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rlist::-webkit-scrollbar{display:none}
.rlist>.rcard{flex:0 0 88%;max-width:520px;scroll-snap-align:start;display:flex;flex-direction:column}
.newcard{align-items:stretch;justify-content:center;gap:14px;padding:22px 18px;border:2px dashed var(--line);background:transparent;box-shadow:none}
.newcard .plus{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:300;align-self:center}
.newcard h3{margin:0;text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.newcard p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.newcard .field{background:var(--surface);box-shadow:var(--shadow)}
.rdots{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.rdots button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.rdots button.on{width:22px;background:var(--accent)}
.rdots button.add{background:transparent;border:1.5px solid var(--line)}
.rdots button.add.on{background:var(--accent);border-color:var(--accent)}
.rcard{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.rcover{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:0;padding:0;cursor:pointer;background:#111;overflow:hidden;color:#fff;text-align:left}
.rcover svg,.rcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rcover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
.rcover .rname{position:absolute;left:18px;right:18px;bottom:14px;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.rcover .rtag{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rcover.hero{border-radius:20px;cursor:default}
.rdays{display:flex;gap:8px;padding:14px 16px 16px;overflow-x:auto;scrollbar-width:none}
.dayb{flex:none;border:0;border-radius:14px;background:var(--surface2);padding:10px 14px;cursor:pointer;text-align:left;min-width:96px}
.dayb .dk{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dayb .dn{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dayb .dn i{font-style:normal;color:var(--accent);font-size:11px}
.dayb:active{background:var(--accent-soft)}
/* historial */
.yearbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yearbar .y{font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ystats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.month{background:var(--surface);border-radius:var(--r);padding:12px 10px 10px;box-shadow:var(--shadow);min-width:0}
.month h3{margin:0 0 8px 4px;font-size:14px;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.month h3 span{font-size:11px;font-weight:700;color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.mgrid .wd{font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:3px}
.dd{position:relative;aspect-ratio:1;max-width:100%;border:0;background:transparent;padding:0;font-size:11px;font-weight:600;color:var(--fg);border-radius:8px;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;cursor:default}
.dd.fut{color:var(--muted);opacity:.45}
.dd.today{background:var(--accent-soft);color:var(--accent);font-weight:800}
.dd.has{cursor:pointer}
.dd.has::after{content:"";position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.dd.has:active{background:var(--accent-soft)}
.dd.multi::after{width:12px;margin-left:-6px;border-radius:3px}
.ro-table{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed}
.ro-table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.ro-table th:first-child{width:52px}
.ro-table td{text-align:center;background:var(--surface2);padding:9px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.ro-table td:first-child{border-radius:10px 0 0 10px}.ro-table td:last-child{border-radius:0 10px 10px 0}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 10px}
.pickday{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
/* login */
#login{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#login .wrap{width:100%;max-width:440px}
#login .logo{width:72px;height:72px;border-radius:20px;display:block;margin-bottom:18px;box-shadow:0 10px 30px rgba(30,123,255,.3)}
#login h1{font-size:40px}
#login .msg{font-size:14px;border-radius:12px;padding:10px 12px;background:var(--surface2)}
#login .msg.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncpill.ok i{background:var(--ok)} .syncpill.pending i{background:var(--pr)} .syncpill.error i,.syncpill.offline i{background:var(--danger)}
/* menú de ejercicio */
#menu{position:absolute;inset:0;z-index:25}
.menu-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.menu-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.menu-panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
.exrow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s,background .15s;border-radius:10px}
.exrow.pressing{transform:scale(.97);background:var(--surface2)}
.exrow .more{color:var(--muted);font-size:20px;width:34px;height:34px}
/* gráficas */
.chartbox{position:relative;height:260px}
.chartbox.tall{height:320px}
.seg{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;flex:1}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.exsel{display:flex;align-items:center;gap:12px}
.selwrap{position:relative;display:flex;flex-direction:column;gap:2px}
.selwrap select{appearance:none;-webkit-appearance:none;border:0;background:var(--surface2);border-radius:12px;padding:12px 36px 12px 12px;font-weight:700;font-size:16px;letter-spacing:-.01em;width:100%;min-height:48px;cursor:pointer;text-overflow:ellipsis}
.selwrap::after{content:"";position:absolute;right:16px;top:20px;width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);pointer-events:none}
.sumrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sumrow:first-child{border-top:0;padding-top:0}.sumrow:last-child{padding-bottom:0}
.delta{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.up{color:var(--ok);background:var(--ok-soft)} .down{color:var(--danger)}
details.hist{border-top:1px solid var(--line);padding:12px 0}
details.hist:first-child{border-top:0}
details.hist summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
details.hist summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:30;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .22s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}}
</style>

const GROUPS = Object.keys(RAW);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const BASE_EX = [];
for (const g of GROUPS) for (const it of RAW[g].split(';')) { const [n,e]=it.split('|'); BASE_EX.push({id:slug(n),name:n,group:g,equip:e}); }

/* ===================== ESTADO ===================== */
const KEY='libreta-hierro.v1';
const APP_VERSION='11 (cambiar ejercicio)';
const uid=()=>Math.random().toString(36).slice(2,9);
let state;
let storageOk=true;
/* ===================== SINCRONIZACIÓN (Supabase) ===================== */
const CFG_OK = typeof window.supabase!=='undefined' && window.SUPABASE_URL && !/TU_/.test(window.SUPABASE_URL+window.SUPABASE_ANON_KEY);
const SB = CFG_OK ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;
let user=null, sync='local', pushTimer=null;
function writeLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); storageOk=true; }catch(e){ storageOk=false; } }
function save(){ state._ts=Date.now(); writeLocal(); schedulePush(); }
function schedulePush(){ if(!SB||!user) return; setSync('pending'); clearTimeout(pushTimer); pushTimer=setTimeout(push,800); }
async function push(){
  if(!SB||!user) return;
  try{ const {error}=await SB.from('app_state').upsert({user_id:user.id,data:state,updated_at:new Date(state._ts||Date.now()).toISOString()}); if(error) throw error; setSync('ok'); }
  catch(e){ console.warn('push',e); setSync(navigator.onLine?'error':'offline'); }
}
async function pull(){
  if(!SB||!user) return false;
  const {data,error}=await SB.from('app_state').select('data').eq('user_id',user.id).maybeSingle();
  if(error){ setSync(navigator.onLine?'error':'offline'); return false; }
  if(!data){ await push(); return false; }
  const remote=data.data||{};
  if((remote._ts||0)>(state._ts||0)){ adopt(remote); writeLocal(); setSync('ok'); return true; }
  if((state._ts||0)>(remote._ts||0)) await push(); else setSync('ok');
  return false;
}
function adopt(d){ state={routines:d.routines||[],sessions:d.sessions||[],settings:Object.assign({rest:90},d.settings||{}),custom:d.custom||[],overrides:d.overrides||{},hidden:d.hidden||[],active:d.active||null,_ts:d._ts||Date.now()}; rebuildEx(); prog.sel=null; }
const SYNC_TXT={local:'Solo en este móvil',ok:'Sincronizado',pending:'Guardando…',error:'Error al sincronizar',offline:'Sin conexión: se subirá al volver'};
function setSync(v){ sync=v; const el=$('#syncpill'); if(el){ el.className='syncpill '+v; el.innerHTML=`<i></i>${SYNC_TXT[v]}`; } }
function showLogin(msg='',err=false){
  const L=$('#login'); L.hidden=false;
  L.innerHTML=`<div class="wrap stack" style="gap:14px">
    <div><img class="logo" src="icon-192.png" alt=""><h1>Libreta de Hierro</h1><div class="muted" style="margin-top:6px">Entra para guardar tus rutinas y entrenos en la nube y verlos en todos tus dispositivos.</div></div>
    ${msg?`<div class="msg ${err?'err':''}">${esc(msg)}</div>`:''}
    <div><label class="lbl" for="lgEmail">Email</label><input class="field" id="lgEmail" type="email" autocomplete="email" inputmode="email" placeholder="tu@email.com"></div>
    <div><label class="lbl" for="lgPass">Contraseña</label><input class="field" id="lgPass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></div>
    <button class="btn primary big" data-act="login">Entrar</button>
    <button class="btn big" data-act="signup">Crear cuenta</button>
  </div>`;
}
async function afterLogin(u){
  user=u; $('#login').hidden=true; $('#login').innerHTML='';
  render(); setSync('pending');
  if(await pull()) render();
}
async function boot(){
  load(); rebuildEx(); if(state.active) nav.tab='entreno';
  if(!SB){ render(); if(!CFG_OK) toast('Modo local: falta configurar Supabase'); return; }
  const {data:{session}}=await SB.auth.getSession();
  if(session) afterLogin(session.user); else showLogin();
  SB.auth.onAuthStateChange((ev,sess)=>{ if(ev==='SIGNED_OUT'){ user=null; showLogin(); } });
}
window.addEventListener('online',()=>{ if(user) push(); });
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&user){ const busy=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName); if(!busy && await pull()) render(); } });
function load(){
  let s=null;
  try{ const t=localStorage.getItem(KEY); if(t) s=JSON.parse(t); }catch(e){ storageOk=false; }
  state = s || {routines:[],sessions:[],settings:{rest:90},custom:[],active:null,_ts:0};
  state.settings = Object.assign({rest:90}, state.settings||{});
  state.custom = state.custom||[]; state.overrides=state.overrides||{}; state.hidden=state.hidden||[];
  for(const r of state.routines) if(r.example && r.art==null) r.art=0;
}

  }
  return `<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${bg}${g}</svg>`;

function seed(){
  const mk=(n,sets,reps,rest)=>({exId:slug(n),sets,reps,rest});
  const days=[
    {id:uid(),name:'Empuje',exercises:[mk('Press banca con barra',4,'6-8',150),mk('Press inclinado con mancuernas',3,'8-10',120),mk('Elevaciones laterales con mancuernas',3,'12-15',60),mk('Extensión en polea con cuerda',3,'10-12',60)]},
    {id:uid(),name:'Tirón',exercises:[mk('Jalón al pecho agarre ancho',4,'8-10',120),mk('Remo con barra',3,'6-8',150),mk('Face pull',3,'12-15',60),mk('Curl con barra Z',3,'8-12',90)]},
    {id:uid(),name:'Pierna',exercises:[mk('Sentadilla trasera con barra',4,'5-8',180),mk('Peso muerto rumano con barra',3,'8-10',150),mk('Prensa de piernas 45°',3,'10-12',120),mk('Elevación de talones de pie en máquina',4,'10-15',60)]}
  ];
  const r={id:uid(),name:'PPL',example:true,days};
  const base={'press-banca-con-barra':70,'press-inclinado-con-mancuernas':26,'elevaciones-laterales-con-mancuernas':10,'extension-en-polea-con-cuerda':25,'jalon-al-pecho-agarre-ancho':55,'remo-con-barra':60,'face-pull':20,'curl-con-barra-z':30,'sentadilla-trasera-con-barra':90,'peso-muerto-rumano-con-barra':80,'prensa-de-piernas-45':160,'elevacion-de-talones-de-pie-en-maquina':60};
  let rnd=7; const rand=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280;};
  const sessions=[]; const today=new Date(); today.setHours(18,30,0,0);
  const weeks=10; const start=new Date(today); start.setDate(start.getDate()-weeks*7);
  while(start.getDay()!==1) start.setDate(start.getDate()+1);
  for(let w=0;w<weeks;w++){
    [0,2,4].forEach((off,di)=>{
      const d=new Date(start); d.setDate(d.getDate()+w*7+off);
      if(d>=today || rand()<0.08) return;
      const day=days[di];
      const entries=day.exercises.map(e=>{
        const [lo,hi]=e.reps.split('-').map(Number);
        const b=base[e.exId]*(1+0.018*w+(rand()-0.5)*0.03);
        const step=b<35?1:2.5;
        const wgt=Math.round(b/step)*step;
        const sets=[];
        for(let i=0;i<e.sets;i++){ const r=Math.max(lo,Math.min(hi,Math.round(hi-i*0.8-rand()*1.5))); sets.push({w:wgt,r,rir:Math.max(0,Math.min(4,Math.round(3-i*0.7-rand())))}); }
        return {exId:e.exId,sets};
      });
      sessions.push({id:uid(),example:true,date:d.toISOString(),routineId:r.id,dayId:day.id,routineName:r.name,dayName:day.name,dur:55+Math.round(rand()*20),entries});
    });
  }
  return {routines:[r],sessions,settings:{rest:90},custom:[],active:null};
}

/* temporizador de descanso */
let rest=null, audioCtx=null;
function startRest(sec){
  requestWake();
  rest={end:Date.now()+sec*1000,total:sec,fired:false};
  $('#restbar').hidden=false; drawRest();
}
function stopRest(){ rest=null; $('#restbar').hidden=true; releaseWake(); }
function drawRest(){
  if(!rest) return;
  const left=(rest.end-Date.now())/1000;
  if(left<=0 && !rest.fired){ rest.fired=true; beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} }
  if(left<-4){ stopRest(); return; }
  const pct=Math.max(0,Math.min(100,100*left/rest.total));
  $('#restbar').innerHTML=`<div class="inner"><div class="grow stack" style="gap:6px"><div class="row"><span class="clock">${left>0?mmss(left):'¡Ya!'}</span><span class="small" style="opacity:.8">${left>0?'Descanso':'Siguiente serie'}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div><button data-act="restAdj" data-v="-15">−15</button><button data-act="restAdj" data-v="15">+15</button><button data-act="restSkip">Saltar</button></div>`;
}
function beep(){
  try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.25,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6); o.start(); o.stop(audioCtx.currentTime+.6);}catch(e){}
}

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function sessionsByDay(){ const m={}; for(const s of state.sessions){ const k=dkey(new Date(s.date)); (m[k]=m[k]||[]).push(s); } return m; }
const sessVol=s=>s.entries.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);

  header('Historial');

  const years=state.sessions.map(s=>new Date(s.date).getFullYear());
  const minY=Math.min(today.getFullYear(),...years), maxY=today.getFullYear();
  const totVol=inYear.reduce((a,s)=>a+sessVol(s),0);
  let months='';
  for(let m=0;m<12;m++){
    const first=new Date(Y,m,1), days=new Date(Y,m+1,0).getDate(), off=(first.getDay()+6)%7;

    for(let d=1;d<=days;d++){
      const dt=new Date(Y,m,d), k=dkey(dt), ss=byDay[k];
      const cls=['dd',ss?'has':'',ss&&ss.length>1?'multi':'',dt>today?'fut':'',+dt===+today?'today':''].join(' ');
      cells+=ss?`<button class="${cls}" data-act="openDay" data-v="${k}" aria-label="${d} de ${MESES[m]}: ${ss.map(x=>esc(x.dayName)).join(', ')}">${d}</button>`:`<span class="${cls}">${d}</span>`;
    }

  }
  $('#view').innerHTML=`<div class="stack">
    <div class="yearbar"><button class="icon" data-act="histYear" data-v="-1" aria-label="Año anterior" ${Y<=minY?'disabled':''}>‹</button><span class="y">${Y}</span><button class="icon" data-act="histYear" data-v="1" aria-label="Año siguiente" ${Y>=maxY?'disabled':''}>›</button></div>
    <div class="card ystats"><div class="stat"><div class="k">Entrenos</div><div class="v">${inYear.length}</div></div><div class="stat"><div class="k">Volumen</div><div class="v">${fmtKg(Math.round(totVol/100)/10)} t</div></div><div class="stat"><div class="k">Series</div><div class="v">${inYear.reduce((a,s)=>a+s.entries.reduce((b,e)=>b+e.sets.length,0),0)}</div></div></div>

function openDay(k,idx=0){

(function(){ let t=null,x0=0,y0=0,fired=false;
  document.addEventListener('pointerdown',e=>{fired=false; const r=e.target.closest('#exlist .exrow'); if(!r||e.target.closest('.more')) return; x0=e.clientX; y0=e.clientY; r.classList.add('pressing');
    t=setTimeout(()=>{fired=true; r.classList.remove('pressing'); openExMenu(r.dataset.id);},500);});
  const cancel=()=>{clearTimeout(t); t=null; document.querySelectorAll('.exrow.pressing').forEach(r=>r.classList.remove('pressing'));};
  document.addEventListener('pointermove',e=>{ if(t&&(Math.abs(e.clientX-x0)>8||Math.abs(e.clientY-y0)>8)) cancel(); });
  document.addEventListener('pointerup',cancel); document.addEventListener('pointercancel',cancel);
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('#exlist .exrow')) e.preventDefault(); });
  document.addEventListener('click',e=>{ if(fired&&e.target.closest('#exlist .exrow')){ e.stopPropagation(); e.preventDefault(); fired=false; } },true);
})();
async function squareThumb(file,size=160){
  const url=URL.createObjectURL(file); const img=new Image();
  await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url;});
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
  const s=Math.min(img.width,img.height); x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
  URL.revokeObjectURL(url); return c.toDataURL('image/jpeg',0.75);
}

  openDay:b=>openDay(b.dataset.v,+(b.dataset.i||0)),
  delSession:b=>{if(!armed(b))return; state.sessions=state.sessions.filter(x=>x.id!==b.dataset.id); prog.sel=null; save(); closePicker();
    if(afterFinish){afterFinish=false; nav.tab='rutinas'; nav.routineId=null; nav.dayId=null;} render(); toast('Entrenamiento eliminado');},
  copyBk:async b=>{const txt=JSON.stringify({app:'libreta-hierro',v:1,data:{routines:state.routines,sessions:state.sessions,settings:state.settings,custom:state.custom,overrides:state.overrides||{},hidden:state.hidden||[]}});
    try{ await navigator.clipboard.writeText(txt); toast('Copia copiada. Pégala en Notas o envíatela.'); }catch(e){ const t=$('#bkIn'); t.value=txt; t.focus(); t.select(); toast('Texto seleccionado: cópialo manualmente'); }},
  restoreBk:()=>{try{const o=JSON.parse($('#bkIn').value); const d=o.data||o; if(!Array.isArray(d.routines)||!Array.isArray(d.sessions)) throw 0; state={routines:d.routines,sessions:d.sessions,settings:Object.assign({rest:90},d.settings),custom:d.custom||[],overrides:d.overrides||{},hidden:d.hidden||[],active:null}; rebuildEx(); prog.sel=null; save(); render(); toast('Datos restaurados');}catch(e){toast('Ese texto no es una copia válida de la app');}},
  delExample:b=>{if(!armed(b))return; state.routines=state.routines.filter(r=>!r.example); state.sessions=state.sessions.filter(s=>!s.example); if(state.active&&!findR(state.active.routineId)) state.active=null; prog.sel=null; save(); render(); toast('Datos de ejemplo borrados');},
  delAll:b=>{if(!armed(b))return; state={routines:[],sessions:[],settings:state.settings,custom:[],active:null}; rebuildEx(); prog.sel=null; stopRest(); save(); render(); toast('Todo borrado');}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(f){e.preventDefault(); f(b);} });
const CHG={
  renameR:el=>{const r=findR(nav.routineId); r.name=el.value.trim()||r.name; save(); header(r.name,'backHome');},
  renameD:el=>{const d=findD(findR(nav.routineId),nav.dayId); d.name=el.value.trim()||d.name; save(); header(d.name,'backR');},
  exParam:el=>{const d=findD(findR(nav.routineId),nav.dayId); const e=d.exercises[+el.dataset.i]; const f=el.dataset.f; e[f]=f==='reps'?el.value.trim():Math.max(1,Math.min(f==='sets'?10:600,parseInt(el.value)||1)); save();},
  progEx:el=>{prog.sel=[el.value]; renderProgreso();},
  period:el=>{prog.period=+el.value; renderProgreso();},
  defRest:el=>{state.settings.rest=+el.value; save(); toast('Guardado');}
};
document.addEventListener('change',e=>{const el=e.target; const k=el.dataset.actChange; if(k&&CHG[k]) CHG[k](el);});
document.addEventListener('input',e=>{const el=e.target; if(el.dataset.e!==undefined&&el.dataset.f&&state.active){ const s=state.active.entries[+el.dataset.e].sets[+el.dataset.s]; s[el.dataset.f]=el.value; save(); }});
document.addEventListener('change',e=>{const el=e.target; if(el.tagName==='SELECT'&&el.dataset.e!==undefined&&state.active){ state.active.entries[+el.dataset.e].sets[+el.dataset.s].rir=el.value; save(); }});
document.addEventListener('change',async e=>{ if(e.target.id!=='nxPhotoIn'||!e.target.files[0]) return;
  try{ newExImg=await squareThumb(e.target.files[0]); $('#nxPrev').innerHTML=`<span class="av img"><img src="${newExImg}" alt=""></span>`; }catch(err){ toast('No se ha podido leer esa imagen. Prueba con otra.'); }
});
document.addEventListener('change',async e=>{ if(e.target.id!=='photoIn'||!e.target.files[0]) return;
  const f=e.target.files[0]; const r=findR(nav.routineId); if(!r) return;
  try{ const url=URL.createObjectURL(f); const img=new Image(); await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url;});
    const W=900, H=Math.round(W*9/16), c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
    const sc=Math.max(W/img.width,H/img.height), w=img.width*sc, h=img.height*sc; x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    r.photo=c.toDataURL('image/jpeg',0.72); URL.revokeObjectURL(url); save(); render(); toast(storageOk?'Portada actualizada':'La foto es demasiado grande para guardarse');
  }catch(err){ toast('No se ha podido leer esa imagen. Prueba con otra foto.'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(e.target.id==='newR') ACT.addR(); if(e.target.id==='newD') ACT.addD(); if(e.target.id==='cxName') ACT.createEx(); if(e.target.id==='nxName') ACT.saveNewEx(); if(e.target.id==='lgPass') ACT.login(document.querySelector('[data-act=login]')); }});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&rest) requestWake(); });
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(nav.tab==='progreso') renderProgreso(); }); }catch(e){}
new MutationObserver(()=>{ if(nav.tab==='progreso') renderProgreso(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
setInterval(()=>{ if(state.active&&nav.tab==='entreno') updateElapsed(); if(rest) drawRest(); },250);

boot();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
